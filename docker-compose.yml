services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
      POSTGRES_DB: nexora
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  redis:
    image: redis:7
    ports: ["6380:6379"]
  document-worker:
    build:
      context: .
      dockerfile: infrastructure/docker/document-worker.Dockerfile
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      - document_uploads:/data/uploads
volumes:
  pgdata:
  document_uploads:
