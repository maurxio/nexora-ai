name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexora_test
          POSTGRES_PASSWORD: nexora_test
          POSTGRES_DB: nexora_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nexora_test -d nexora_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://nexora_test:nexora_test@localhost:5432/nexora_test
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:test:migrate
      - run: npm test
      - run: npm run test:handles
        if: matrix.node == 24
      - run: npm run test:coverage
        if: matrix.node == 24
      - run: npx playwright install --with-deps chromium
        if: matrix.node == 24
      - run: npm run test:e2e
        if: matrix.node == 24
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == 24
        with:
          name: reports
          path: |
            coverage
            apps/web/coverage
            playwright-report
            test-results

  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run test:db:up
      - run: bash scripts/verify-backup.sh
      - if: always()
        run: npm run test:db:down
