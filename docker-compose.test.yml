services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora_test
      POSTGRES_PASSWORD: nexora_test
      POSTGRES_DB: nexora_test
    ports: ['127.0.0.1:55433:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nexora_test -d nexora_test']
      interval: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ['127.0.0.1:56380:6379']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 30
